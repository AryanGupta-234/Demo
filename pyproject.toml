[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-cab-validator"
version = "0.5.0"
description = "Model-independent Pre-CAB validation engine for Normal ServiceNow Change Requests."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.55"]
docs = ["pypdf>=5.0", "openpyxl>=3.1"]
embeddings = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
all = ["openai>=1.55", "pypdf>=5.0", "openpyxl>=3.1", "sentence-transformers>=3.0", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# CI should catch correctness problems, not block backend progress on formatting/modernization churn.
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
where = ["src"]
